name: Generate long sophrology audio

on:
  push:
    branches:
      - migration-cloudflare-pages
    paths:
      - ".github/workflows/generate-sophro-long.yml"
      - "scripts/sophrologie-visualisation-longue.txt"
      - "scripts/generate_sophro_long.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migration-cloudflare-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg wget libportaudio2 portaudio19-dev

      - name: Install Kokoro ONNX
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile "misaki-fork[en]"

      - name: Download Kokoro model and voices
        run: |
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx

      - name: Generate French long sophrology MP3
        run: |
          python scripts/generate_sophro_long.py
          ffmpeg -y -i assets/audio/sophrologie-visualisation-longue.wav -codec:a libmp3lame -q:a 3 assets/audio/sophrologie-visualisation-longue.mp3
          rm assets/audio/sophrologie-visualisation-longue.wav
          test -s assets/audio/sophrologie-visualisation-longue.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 assets/audio/sophrologie-visualisation-longue.mp3

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/sophrologie-visualisation-longue.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Generate long sophrology audio with Kokoro ff_siwis"
          git push origin HEAD:migration-cloudflare-pages
